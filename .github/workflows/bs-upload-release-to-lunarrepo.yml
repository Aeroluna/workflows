name: Upload release to LunarRepo

on:
  workflow_call:
    inputs:
      mods:
        required: true
        type: string
      extend-game-versions:
        required: false
        type: string
    secrets:
      token:
        required: true

jobs:
  upload_release_to_lunarrepo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest release
        uses: robinraju/release-downloader@v1
        with:
          latest: true
          fileName: '*'
          out-file-path: releases

      - name: Upload artifacts
        uses: Aeroluna/beatmods-upload@lunarrepo
        with:
          path: ./releases
          mods: ${{ inputs.mods }}
          extend-game-versions: ${{ inputs.extend-game-versions }}
          token: ${{ secrets.token }}
